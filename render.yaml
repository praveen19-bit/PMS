# Render Blueprint — deploy with "New → Blueprint" pointing at this repo.
# Secrets marked `sync: false` are prompted for on first deploy.

envVarGroups:
  - name: fastrack-supabase
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

services:
  - type: web
    name: fastrack-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - fromGroup: fastrack-supabase
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET   # optional: only for legacy HS256 projects
        sync: false
      - key: CORS_ORIGINS          # e.g. https://fastrack-web.onrender.com
        sync: false

  - type: web
    name: fastrack-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Vite only exposes VITE_-prefixed vars to the browser, so mirror the group values here.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL     # e.g. https://fastrack-api.onrender.com
        sync: false
